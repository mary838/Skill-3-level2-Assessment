<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu with Login and Logout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100">
    <header
      class="bg-white text-white p-4 flex flex-col sm:flex-row justify-between items-center shadow rounded lg:shadow-lg w-full fixed top-0 left-0 z-50"
    >
      <h1 class="text-2xl font-bold text-blue-800">BlogZone</h1>
      <nav class="mt-2 sm:mt-0">
        <ul class="flex sm:flex-row gap-4">
          <li>
            <a
              href="#"
              class="text-gray-700 hover:bg-blue-700 hover:text-white px-3 py-2 rounded"
              >Home</a
            >
          </li>
          <li>
            <a
              href="#"
              class="text-gray-700 hover:bg-blue-700 hover:text-white px-3 py-2 rounded"
              >Posts</a
            >
          </li>
          <li>
            <a
              href="#"
              class="text-gray-700 hover:bg-blue-700 hover:text-white px-3 py-2 rounded"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <div
      class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4 mt-20"
    >
      <div class="bg-white shadow rounded-lg overflow-hidden">
        <img
          src=" https://picsum.photos/300/200 "
          alt="Blog Image"
          class="w-full h-32 object-cover"
        />
        <div class="p-4">
          <h2 class="text-lg font-bold">Blog Title</h2>
          <p class="text-gray-600">Short description of the blog post.</p>
          <button class="mt-2 bg-blue-700 text-white px-4 py-2 rounded">
            Read More
          </button>
        </div>
      </div>

      <div class="bg-white shadow rounded-lg overflow-hidden">
        <img
          src=" https://picsum.photos/300/200 "
          alt="Blog Image"
          class="w-full h-32 object-cover"
        />
        <div class="p-4">
          <h2 class="text-lg font-bold">Blog Title</h2>
          <p class="text-gray-600">Short description of the blog post.</p>
          <button class="mt-2 bg-blue-700 text-white px-4 py-2 rounded">
            Read More
          </button>
        </div>
      </div>
      <div class="bg-white shadow rounded-lg overflow-hidden">
        <img
          src=" https://picsum.photos/300/200 "
          alt="Blog Image"
          class="w-full h-32 object-cover"
        />
        <div class="p-4">
          <h2 class="text-lg font-bold">Blog Title</h2>
          <p class="text-gray-600">Short description of the blog post.</p>
          <button class="mt-2 bg-blue-700 text-white px-4 py-2 rounded">
            Read More
          </button>
        </div>
      </div>
    </div>

    <footer
      class="bg-white text-black py-4 mt-6 grid grid-cols-1 sm:grid-cols-1 md:grid-cols-2"
    >
      <div class="flex justify-center items-center">
        <p class="text-sm">© 2023 BlogZone. All rights reserved.</p>
      </div>
      <div class="flex justify-center items-center">
        <a href="#" class="text-gray-700 hover:text-blue-700 px-2"
          >Privacy Policy</a
        >
        |
        <a href="#" class="text-gray-700 hover:text-blue-700 px-2"
          >Terms of Service</a
        >
      </div>
    </footer>
  </body>
</html>
